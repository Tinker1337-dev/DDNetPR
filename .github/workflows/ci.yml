name: CI Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  rust-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust workspace
        run: cargo check --workspace --all-targets

  cpp-core-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git python3 libsqlite3-dev libssl-dev zlib1g-dev
      - name: Clone DDNetPP & apply DDNetPR patch
        run: |
          git clone https://github.com /tmp/DDNetPP
          git -C /tmp/DDNetPP checkout 4e458fa81
          git -C /tmp/DDNetPP apply "$GITHUB_WORKSPACE/core/ddnetpr_core_v11.7_lts.patch"
      - name: Build DDNetPR Server
        run: |
          cmake -S /tmp/DDNetPP -B /tmp/DDNetPP/build -G Ninja -DCLIENT=OFF -DMYSQL=OFF
          cmake --build /tmp/DDNetPP/build -j$(nproc)
